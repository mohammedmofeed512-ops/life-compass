:root{
  --background:188 100% 97%;--foreground:209 60% 9%;--card:0 0% 100%;
  --primary:209 44% 18%;--primary-foreground:188 100% 97%;
  --secondary:236 100% 92%;--muted:190 40% 92%;--muted-foreground:209 25% 35%;
  --accent:190 65% 64%;--accent-foreground:209 60% 9%;--lavender:236 100% 85%;
  --success:160 84% 39%;--destructive:0 84% 60%;--warning:38 92% 50%;
  --border:190 40% 85%;--input:190 40% 88%;--radius:.75rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground));line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.ltr{direction:ltr;unicode-bidi:isolate}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.muted{color:hsl(var(--muted-foreground))}
.small{font-size:.85rem}.xs{font-size:.75rem}
.bold{font-weight:700}
.success{color:hsl(var(--success))}.danger{color:hsl(var(--destructive))}.accentc{color:hsl(var(--accent))}.primaryc{color:hsl(var(--primary))}
.display{font-family:"Space Grotesk",Cairo,sans-serif}
.svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.svg.lg{width:24px;height:24px}.svg.xl{width:28px;height:28px}

/* nav */
.topnav{position:sticky;top:0;z-index:50;border-bottom:1px solid hsl(var(--border));background:hsl(var(--card)/.85);backdrop-filter:blur(8px)}
.topnav .row{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{width:34px;height:34px;object-fit:contain}
.brand .t1{font-weight:700;font-size:15px;color:hsl(var(--primary));line-height:1}
.brand .t2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:hsl(var(--accent));font-weight:700;line-height:1.3}
.navlinks{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px 0}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:.9rem;color:hsl(var(--muted-foreground));text-decoration:none;white-space:nowrap}
.navlinks a:hover{background:hsl(var(--muted))}
.navlinks a.active{background:hsl(var(--accent));color:hsl(var(--accent-foreground));font-weight:600}
.navtools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sync{display:flex;align-items:center;gap:6px;font-size:.75rem;padding:4px 10px;border-radius:999px;border:1px solid hsl(var(--border));background:hsl(var(--card));white-space:nowrap}
.sync.ok{color:hsl(var(--success))}.sync.off{color:hsl(var(--warning));border-color:hsl(var(--warning)/.5)}.sync.busy{color:hsl(var(--accent))}.sync.err{color:hsl(var(--destructive))}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;color:hsl(var(--muted-foreground))}
.iconbtn:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.iconbtn.danger:hover{color:hsl(var(--destructive))}
.bottomnav{display:none}
main.container{padding-top:24px;padding-bottom:40px}
@media (max-width:900px){
  .topnav .navlinks{display:none}
  .topnav .row{justify-content:space-between}
  .sync .lbl{display:none}
  .bottomnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:50;background:hsl(var(--card)/.97);border-top:1px solid hsl(var(--border));overflow-x:auto;scrollbar-width:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav::-webkit-scrollbar{display:none}
  .bottomnav a{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;font-size:.7rem;color:hsl(var(--muted-foreground));text-decoration:none;white-space:nowrap}
  .bottomnav a.active{color:hsl(var(--accent));font-weight:700}
  main.container{padding-bottom:96px}
}

/* ui */
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgb(0 0 0/.04)}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:.9rem;background:hsl(var(--primary));color:hsl(var(--primary-foreground));transition:.15s;white-space:nowrap}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.outline{background:hsl(var(--card));color:hsl(var(--foreground));border:1px solid hsl(var(--input))}
.btn.outline:hover{background:hsl(var(--accent)/.15)}
.btn.ghost{background:none;color:hsl(var(--muted-foreground))}
.btn.ghost:hover{background:hsl(var(--muted))}
.btn.accent{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn.sm{height:34px;padding:0 12px;font-size:.82rem}
.btn.block{width:100%}
label.lbl{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;height:40px;padding:0 12px;border:1px solid hsl(var(--input));border-radius:10px;background:hsl(var(--card));outline:none;transition:.15s}
textarea.input{height:auto;padding:8px 12px}
.input:focus{border-color:hsl(var(--accent));box-shadow:0 0 0 3px hsl(var(--accent)/.25)}
input[type=number].input,input[type=date].input{direction:ltr;text-align:left}
.field{margin-bottom:0}
h1.page{font-size:1.6rem;font-weight:800;margin-bottom:4px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid hsl(var(--accent)/.4);background:hsl(var(--accent)/.1);color:hsl(var(--primary))}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.bar{height:10px;border-radius:999px;background:hsl(var(--muted));overflow:hidden}
.bar>div{height:100%;background:hsl(var(--accent));border-radius:999px;transition:width .4s}
.bar.success>div{background:hsl(var(--success))}
.bar.danger>div{background:hsl(var(--destructive))}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}
.sep{height:1px;background:hsl(var(--border));margin:10px 0}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:.92rem}
.stat p:first-child{font-size:.8rem;color:hsl(var(--muted-foreground))}
.stat p:last-child{font-size:1.3rem;font-weight:800}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty{padding:30px;text-align:center;color:hsl(var(--muted-foreground))}
.alert{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:.85rem}
.alert.danger{background:hsl(var(--destructive)/.1);color:hsl(var(--destructive))}
.alert.info{background:hsl(var(--accent)/.12);color:hsl(var(--primary))}
.alert.warn{background:hsl(var(--warning)/.12);color:hsl(30 80% 30%)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{width:100%;max-width:420px}
.logo-box{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:20px;background:hsl(var(--card));border:1px solid hsl(var(--accent)/.3);margin-bottom:14px}
.logo-box img{width:60px;height:60px}

/* lifestyle */
.catcard{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);padding:20px;text-align:center;transition:.2s;width:100%}
.catcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgb(0 0 0/.07)}
.caticon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;color:#fff;margin-bottom:10px;transition:.2s}
.catcard:hover .caticon{transform:scale(1.08)}

/* modal */
.overlay{position:fixed;inset:0;background:rgb(10 20 30/.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.modal{background:hsl(var(--card));border-radius:16px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgb(0 0 0/.25)}
.modal .mh{padding:18px 20px 10px;border-bottom:1px solid hsl(var(--border))}
.modal .mb{padding:16px 20px;overflow-y:auto}
.modal .mf{padding:12px 20px;border-top:1px solid hsl(var(--border));display:flex;justify-content:space-between;align-items:center;gap:8px}
.help{position:relative;display:inline-flex}
.help .tip{display:none;position:absolute;bottom:130%;inset-inline-start:50%;transform:translateX(50%);width:220px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));padding:8px 10px;border-radius:8px;font-size:.78rem;font-weight:400;z-index:5;line-height:1.5}
.help.open .tip{display:block}
.qbtn{width:20px;height:20px;border-radius:50%;border:1px solid hsl(var(--border));display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;color:hsl(var(--muted-foreground))}
.qbtn:hover{background:hsl(var(--accent)/.2)}

/* toast */
#toasts{position:fixed;bottom:20px;inset-inline-start:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
@media (max-width:900px){#toasts{bottom:90px;inset-inline:12px}}
.toast{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgb(0 0 0/.12);font-size:.88rem;min-width:220px;animation:fade .2s}
.toast b{display:block}
.toast.err{border-color:hsl(var(--destructive)/.5)}

/* steps */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.step{display:flex;align-items:center;gap:8px;flex:1}
.step .n{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;background:hsl(var(--muted));color:hsl(var(--muted-foreground));flex-shrink:0}
.step.on .n{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.step .line{flex:1;height:1px;background:hsl(var(--border))}
@media (max-width:560px){.step .t{display:none}}

/* calc keypad */
.keypad{direction:ltr}
.screen{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-radius:12px;padding:14px;text-align:right;margin-bottom:12px}
.screen .v{font-size:2rem;font-weight:700;overflow-x:auto;font-family:"Space Grotesk",Cairo}
.screen .o{font-size:.8rem;opacity:.7;min-height:1.2em}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{height:54px;border-radius:12px;background:hsl(var(--muted));font-size:1.2rem;font-weight:600}
.keys button:hover{background:hsl(var(--accent)/.35)}
.keys button.op{background:hsl(var(--accent)/.25);color:hsl(var(--primary))}
.keys button.eq{background:hsl(var(--accent));grid-row:span 2;height:auto}
.keys button.zero{grid-column:span 2}
.keys button.clr{color:hsl(var(--destructive))}

/* tabs */
.tabs{display:flex;gap:4px;background:hsl(var(--muted));padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:9px;font-weight:600;font-size:.9rem;color:hsl(var(--muted-foreground))}
.tabs button.on{background:hsl(var(--card));color:hsl(var(--foreground));box-shadow:0 1px 3px rgb(0 0 0/.08)}
.mini{background:hsl(var(--muted)/.6);border-radius:10px;padding:8px 10px}
.mini p:first-child{font-size:.72rem;color:hsl(var(--muted-foreground))}
.mini p:last-child{font-weight:700}
.card.bad{border-color:hsl(var(--destructive))}

/* collapsible */
.coll{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.coll>.ch{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:700}
.coll>.ch .chev{transition:.2s}
.coll.open>.ch .chev{transform:rotate(180deg)}
.coll>.cb{display:none;padding:0 18px 18px}
.coll.open>.cb{display:block}
.tip-card{border:1px solid hsl(var(--border));border-radius:12px;padding:12px}

/* plan canvas */
.planbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.planstats{margin-inline-start:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:hsl(var(--muted-foreground));align-items:center}
.canvas{position:relative;height:620px;border:1px solid hsl(var(--border));border-radius:var(--radius);background-color:hsl(var(--card));background-image:radial-gradient(hsl(var(--border)) 1px,transparent 1px);background-size:20px 20px;overflow:hidden;touch-action:none;cursor:grab;direction:ltr}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.world svg.edges path{pointer-events:stroke;cursor:pointer}
.world svg.edges path:hover{stroke:hsl(var(--destructive))!important}
.pnode{position:absolute;width:250px;background:hsl(var(--card));border:2px solid;border-radius:12px;padding:10px;box-shadow:0 4px 14px rgb(0 0 0/.08);direction:rtl;cursor:default}
.pnode .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:move;user-select:none}
.pnode .input{height:32px;font-size:.82rem;padding:0 8px;border-radius:8px}
.pnode .nl{font-size:.7rem;color:hsl(var(--muted-foreground));display:flex;gap:4px;align-items:center;margin:6px 0 2px}
.pnode .handle{position:absolute;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:hsl(var(--accent));border:2px solid #fff;box-shadow:0 0 0 1px hsl(var(--accent));cursor:crosshair}
.pnode .handle.t{top:-9px}.pnode .handle.b{bottom:-9px}
.pnode .handle.armed{background:hsl(var(--success));box-shadow:0 0 0 4px hsl(var(--success)/.35)}
.pnode.done .ttl{text-decoration:line-through;opacity:.7}
.zoomctl{position:absolute;bottom:12px;left:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zoomctl button{width:34px;height:34px;border-radius:8px;background:hsl(var(--card));border:1px solid hsl(var(--border));font-weight:700}
.connecthint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:hsl(var(--primary));color:hsl(var(--primary-foreground));padding:6px 12px;border-radius:999px;font-size:.8rem;z-index:6;direction:rtl}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:.72rem;color:hsl(var(--muted-foreground));padding:4px 0}
.cal button{height:38px;border-radius:8px;font-size:.85rem;position:relative}
.cal button:hover{background:hsl(var(--muted))}
.cal button.sel{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.cal button.has::after{content:"";position:absolute;bottom:4px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:hsl(var(--accent))}
.cal button.today{box-shadow:inset 0 0 0 1px hsl(var(--accent))}
.calwrap{display:grid;grid-template-columns:320px 1fr;gap:20px}
@media (max-width:760px){.calwrap{grid-template-columns:1fr}}

.quote{background:linear-gradient(135deg,hsl(var(--primary)),hsl(209 44% 28%));color:hsl(var(--primary-foreground));border-radius:var(--radius);padding:20px;display:flex;gap:12px;align-items:center}
.hero-rate{background:linear-gradient(135deg,hsl(var(--primary)),hsl(209 44% 26%));color:hsl(var(--primary-foreground));border-radius:16px;padding:24px;text-align:center;margin-bottom:16px}
.hero-rate .big{font-size:3rem;font-weight:800;font-family:"Space Grotesk",Cairo;color:hsl(var(--accent))}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:hsl(var(--muted-foreground))}

/* v3 additions */
.sync .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.sync .sl{display:none}
.sync{cursor:pointer}
@media (max-width:900px){.sync .sl{display:inline;font-weight:700}.sync .svg{display:none}}
.pc{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:hsl(var(--destructive));color:#fff;font-size:.7rem;font-weight:700;margin-inline-start:4px}
.bottomnav a{position:relative}
.bottomnav .dotpc{position:absolute;top:2px;inset-inline-end:14px;min-width:9px;width:9px;height:9px;padding:0;margin:0}
@media (max-width:900px){.bottomnav{justify-content:space-around;overflow:visible}.bottomnav a{flex:1 1 0;min-width:0}.bottomnav a span:not(.pc){overflow:hidden;text-overflow:ellipsis;max-width:100%}}
.overlay.sheet{align-items:flex-end;padding:0}
.overlay.sheet .modal{border-radius:18px 18px 0 0;max-width:560px;padding-bottom:env(safe-area-inset-bottom)}
.sheetlink{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;color:hsl(var(--foreground));font-weight:600;width:100%;text-align:right}
.sheetlink:hover,.sheetlink.active{background:hsl(var(--muted))}
.splitbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:hsl(var(--muted))}
.splitbar .paid{background:hsl(var(--success));transition:width .3s}
.splitbar .unpaid{background:repeating-linear-gradient(45deg,hsl(var(--warning)/.55),hsl(var(--warning)/.55) 6px,hsl(var(--warning)/.3) 6px,hsl(var(--warning)/.3) 12px);transition:width .3s}
.g5{grid-template-columns:2fr 1fr 1fr 1.3fr 1fr}
@media (max-width:900px){.g5{grid-template-columns:repeat(2,1fr)}.g5>div:first-child{grid-column:1/-1}}
.input.bad{border-color:hsl(var(--destructive));box-shadow:0 0 0 3px hsl(var(--destructive)/.15)}
.monthrow{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:10px}
.monthrow:hover,.monthrow.on{background:hsl(var(--muted)/.7)}
button.step{background:none;border:0;cursor:pointer;font:inherit;color:inherit}
.help .tip{white-space:normal}

a.btn{text-decoration:none}
@media (max-width:900px){.bottomnav a{font-size:.66rem;padding:4px 2px}.bottomnav a span:not(.pc){white-space:nowrap;text-overflow:clip}}

/* v4: lifestyle rows, modes, realism, ramp */
.lrow{display:grid;grid-template-columns:1fr 110px 110px 64px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed hsl(var(--border))}
.lrow.lhead{border:0;padding-top:0;font-weight:700;text-align:center}
.lrow .input{height:36px}
.ytog{display:flex;align-items:center;gap:4px;font-size:.75rem;cursor:pointer;justify-content:center}
@media (max-width:560px){.lrow{grid-template-columns:1fr 1fr 56px}.lrow>div:first-child{grid-column:1/-1}.lrow.lhead span:first-child{display:none}.lrow.lhead{grid-template-columns:1fr 1fr 56px}}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:right;padding:14px;border:2px solid hsl(var(--border));border-radius:12px;background:hsl(var(--card))}
.modebtn b{display:flex;align-items:center;gap:6px}
.modebtn.on{border-color:hsl(var(--accent));background:hsl(var(--accent)/.1)}
.warnc{color:hsl(30 85% 40%)}
.sol{list-style:none;display:grid;gap:8px;padding:0}
.sol li{padding:10px 12px;border:1px solid hsl(var(--border));border-radius:10px;font-size:.88rem;line-height:1.7}
.ramp{display:flex;align-items:flex-end;gap:4px;height:110px;padding:6px 4px 0;border-bottom:1px solid hsl(var(--border));direction:rtl}
.rcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:0}
.rbar{width:100%;max-width:34px;background:hsl(var(--accent)/.55);border-radius:6px 6px 0 0}
.rcol.now .rbar{background:hsl(var(--success))}
.rcol span{color:hsl(var(--muted-foreground))}
.card+.card{margin-top:16px}

/* v5: fixed commitments */
.cmrow{display:grid;grid-template-columns:1.4fr 1.6fr auto 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed hsl(var(--border))}
.cmrow .input{height:36px}
.cmrow input[type=number]{width:64px;padding:0 6px}
@media (max-width:640px){.cmrow{grid-template-columns:1fr auto 36px}.cmrow>div:first-child{grid-column:1/-1}}
.cmrow [data-cw]{white-space:nowrap}

/* v6: help, switches, paused cards */
.howto{background:hsl(var(--accent)/.08);border:1px solid hsl(var(--accent)/.35);border-radius:12px;padding:0;margin-bottom:14px}
.howto summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:.9rem;color:hsl(var(--primary))}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:"＋";margin-inline-start:auto;font-weight:400;color:hsl(var(--muted-foreground))}
.howto[open] summary::after{content:"－"}
.howto>div{padding:0 16px 12px}
.steps-ol{padding-inline-start:20px;display:grid;gap:6px;line-height:1.75}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sl{width:40px;height:22px;border-radius:999px;background:hsl(var(--muted-foreground)/.35);position:relative;transition:.2s;flex-shrink:0}
.switch .sl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgb(0 0 0/.2)}
.switch input:checked+.sl{background:hsl(var(--success))}
.switch input:checked+.sl::after{inset-inline-start:21px}
.switch input:focus-visible+.sl{box-shadow:0 0 0 3px hsl(var(--accent)/.4)}
.card.paused{opacity:.75;background:repeating-linear-gradient(-45deg,hsl(var(--card)),hsl(var(--card)) 10px,hsl(var(--muted)/.5) 10px,hsl(var(--muted)/.5) 20px)}
.card.paused .grid input:not([data-note-s]):not([data-note-c]){opacity:.7}
.schedline{margin-top:10px;padding:8px 10px;border-radius:10px;background:hsl(var(--muted)/.6);line-height:1.8}
.mini p:first-child{display:flex;align-items:center;gap:4px}
.help .tip{z-index:60}
@media (max-width:700px){.help.open .tip{position:fixed;left:12px;right:12px;top:72px;bottom:auto;transform:none;width:auto;inset-inline-start:auto;box-shadow:0 8px 30px rgb(0 0 0/.3);font-size:.85rem}}
/* v7 about */
.dev{display:flex;gap:12px;align-items:center}
.devav{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--primary)),hsl(var(--accent)));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn.insta{background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af);color:#fff;height:46px}
@media (max-width:900px){#aboutbtn{display:none}}
</style>
</head>

const itemVal = (v, key) => { if (v == null) return 0; if (typeof v !== 'object') return key === 't' ? pos(v) : 0; const x = pos(v[key]); return v.y ? x / 12 : x; };

  const income = pos((d.profile || {}).currentIncome);
  const tb = timeBudget(d);
  const mode = ps.mode || (tb.hasJob || income > 0 ? 'side' : 'full');
  const basisNow = ps.basis === 'now' && lifeN > 0;
  const base = basisNow ? lifeN : lifeT;
  const covered = mode === 'side' ? income : pos(ps.passive);
  const need = Math.max(base - covered, 0);                       // net monthly money freelancing must bring
  const safety = pos(ps.safetyPct, 100) / 100;
  const goal = need * (1 + safety);                               // net monthly goal incl. safety margin for weak months
  const dedPct = Math.min(pos(ps.platformPct, 100) + pos(ps.transferPct, 100) + pos(ps.taxPct, 100), 90);
  const keep = 1 - dedPct / 100;                                  // share of the price that reaches you
  const grossGoal = keep > 0 ? goal / keep : 0;                   // what clients must pay you per month
  let workDays = 0, yearHours = 0, weeksWorked = 0;
  if (mode === 'side') { weeksWorked = Math.max(52 - pos(ps.weeksOff, 52), 0); yearHours = pos(ps.sideHours, 100) * weeksWorked; workDays = null; }
  else { const dpw = pos(c.daysPerWeek, 7); workDays = Math.max(dpw * 52 - pos(c.vacationDays, 365) - pos(c.sickDays, 365) - pos(ps.holidays, 365), 0); yearHours = workDays * pos(c.hoursPerDay, 24); weeksWorked = dpw > 0 ? workDays / dpw : 0; }

  const rate = billYear > 0 ? grossGoal * 12 / billYear : 0;      // price per paid hour you must charge

  const market = pos(ps.marketRate);

}

async function pull() {

  must(st); must(ro0);
  const prevStatus = D.status, prevAdmin = D.isAdmin;
  D.status = st.data ? st.data.status : 'pending';
  D.isAdmin = (ro0.data || []).some(r => r.role === 'admin');
  persist();
  if (D.status !== 'approved') { if (prevStatus !== D.status || prevAdmin !== D.isAdmin) render(); return; }
  if (prevStatus !== 'approved' && prevStatus !== null) { render(); }
  if (D.isAdmin) { try { const pc = await sb.from('user_status').select('user_id', { count: 'exact', head: true }).eq('status', 'pending'); if (!pc.error && pc.count !== D.pendingReq) { D.pendingReq = pc.count || 0; persist(); updateNavBadges(); } } catch (e) {} }
  const [pr, ls, cs, pe, ap, fp, ro] = await Promise.all([
    sb.from('profiles').select('*').eq('user_id', id).maybeSingle(),

    sb.from('calculator_settings').select('*').eq('user_id', id).maybeSingle(),
    sb.from('progress_entries').select('*').eq('user_id', id).order('created_at', { ascending: true }),

    sb.from('user_roles').select('role').eq('user_id', id),
  ]);

  let touched = false;

    D.profile = { name: t.name || '', birthDate: t.birth_date || '', residence: t.residence || '', originCountry: t.origin_country || '', languages: t.languages || '', currency: t.currency || 'SAR', educationLevel: t.education_level || '', workField: t.work_field || '', experienceLevel: t.experience_level || '', currentIncome: num(t.current_income), incomeSources: t.income_sources || '', maritalStatus: t.marital_status || '', familyMembers: num(t.family_members), familyDetails: t.family_details || '', commitments: Array.isArray(t.commitments) ? t.commitments : [] };
    D.profileComplete = !!t.profile_complete; touched = true;
  }
  (ls.data || []).forEach(r => { if (r.category in D.lifestyle && !D.dirty.lifestyle[r.category]) { D.lifestyle[r.category] = r.items || {}; touched = true; } });
  if (cs.data && !D.dirty.calculator) { const c = cs.data; D.calculator = { hoursPerDay: num(c.hours_per_day ?? 8), daysPerWeek: num(c.days_per_week ?? 5), vacationDays: num(c.vacation_days ?? 21), sickDays: num(c.sick_days ?? 5), nonBillable: { ...DEF_NB, ...(c.non_billable || {}) }, plan: { ...(c.plan_settings || {}) } }; touched = true; }
  const local = new Map(D.progress.map(p => [p.id, p]));
  (pe.data || []).forEach(r => { if (!D.dirty.progress[r.id]) { local.set(r.id, { id: r.id, date: r.date, earned: num(r.earned), note: r.note || '', deleted: !!r.deleted, created_at: r.created_at }); touched = true; } });
  D.progress = [...local.values()].sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
  if (ap.data && ap.data.data && ap.data.data.nodes) { const m = mergePlan(D.plan, ap.data.data); if (JSON.stringify(m) !== JSON.stringify(D.plan)) { D.plan = m; touched = true; } }
  if (fp.data && fp.data.data && fp.data.data.services) { const m = mergeFree(D.freelance, fp.data.data); if (JSON.stringify(m) !== JSON.stringify(D.freelance)) { D.freelance = m; touched = true; } }
  const wasAdmin = D.isAdmin;
  D.isAdmin = (ro.data || []).some(r => r.role === 'admin');
  persist();
  if ((touched || wasAdmin !== D.isAdmin) && !isEditing()) render();
}

    <div style="text-align:center;margin-top:16px"><button id="labout" class="small row" style="margin:0 auto;color:hsl(var(--primary));font-weight:600">${I('info')} عن البرنامج والمطوّر</button>
      ${!navigator.onLine ? `<div class="alert warn" style="margin-top:14px">${I('cloudoff')}<span>أنت غير متصل. تسجيل الدخول أول مرة على هذا الجهاز يحتاج إنترنت، وبعدها يعمل الموقع بدون نت.</span></div>` : ''}
    </div></div></div>`;
}
function bindLogin() {
  $('#lsw').onclick = () => { loginMode = loginMode === 'up' ? 'in' : 'up'; render(); };
  $('#labout').onclick = openAbout;
  if ($('#lfg')) $('#lfg').onclick = () => { $('#lmsg').innerHTML = `<div class="alert info">${I('shield')}<span>تواصل مع المدرّب ليعيّن لك كلمة مرور مؤقتة، ثم سجّل الدخول بها وغيّرها من صفحة «الملف الشخصي».</span></div>`; };
  const msg = (t, ok) => { $('#lmsg').innerHTML = t ? `<div class="alert ${ok ? 'info' : 'danger'}">${esc(t)}</div>` : ''; };
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const em = $('#em').value.trim(), pw = $('#pw').value, nm = $('#nm') ? $('#nm').value.trim() : '';
    if (loginMode === 'up' && !nm) return msg('يرجى إدخال اسمك');
    if (!em || !pw) return msg('يرجى إدخال البريد وكلمة المرور');
    if (pw.length < 6) return msg('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
    if (!navigator.onLine) return msg('لا يوجد اتصال بالإنترنت. تسجيل الدخول أول مرة يحتاج اتصالاً');
    const b = $('#lbtn'); b.disabled = true; b.textContent = 'جاري...';
    try {
      if (loginMode === 'up') {
        const { data, error } = await sb.auth.signUp({ email: em, password: pw, options: { data: { name: nm } } });
        if (error) throw error;
        if (data.session) { await afterLogin(data.session.user, true); return; }
        if (data.user && data.user.identities && data.user.identities.length === 0) throw new Error('already registered');
        loginMode = 'in'; render();
        $('#em').value = em;
        $('#lmsg').innerHTML = `<div class="alert info">تم إنشاء الحساب! سجّل الدخول الآن، وسيبقى حسابك بانتظار موافقة المدير.</div>`;
        return;
      }
      const { data, error } = await sb.auth.signInWithPassword({ email: em, password: pw });
      if (error) throw error;
      await afterLogin(data.user, false);
    } catch (err) {
      msg(AR_ERR(err.message || err));
      const bb = $('#lbtn'); if (bb) { bb.disabled = false; bb.innerHTML = (loginMode === 'up' ? 'إنشاء حساب ' : 'دخول ') + I(loginMode === 'up' ? 'userplus' : 'login'); }
    }
  };
}
async function afterLogin(u, isNew) {
  setUser(u);
  syncState = 'idle';
  try { await withTimeout(pull(), 10000); D.pulledOnce = true; persist(); } catch (e) { console.warn(e); }
  location.hash = (isNew || !D.profileComplete) ? '#/profile' : '#/lifestyle';
  if (isNew && !D.profile.name) { try { D.profile.name = (u.user_metadata && u.user_metadata.name) || ''; } catch (e) {} }
  render();
  sync();
}

const CURRENCIES = [['SAR', 'ريال سعودي'], ['AED', 'درهم إماراتي'], ['USD', 'دولار أمريكي'], ['EUR', 'يورو'], ['EGP', 'جنيه مصري'], ['KWD', 'دينار كويتي'], ['QAR', 'ريال قطري'], ['BHD', 'دينار بحريني'], ['OMR', 'ريال عماني'], ['JOD', 'دينار أردني'], ['ILS', 'شيكل'], ['TRY', 'ليرة تركية'], ['SYP', 'ليرة سورية'], ['LBP', 'ليرة لبنانية']];
const STEPS = ['معلومات شخصية', 'التعليم والعمل', 'الحالة الاجتماعية', 'أوقاتي الثابتة'];
let profStep = 0, profDraft = null;
PAGES['/profile'] = view => {
  if (!profDraft) profDraft = { ...D.profile, commitments: (D.profile.commitments || []).map(x => ({ ...x })) };
  const a = profDraft, s = profStep;
  const sel = (k, opts, ph = 'اختر') => `<select class="input" data-k="${k}"><option value="">${ph}</option>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${a[k] === v ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  const inp = (k, ph = '', type = 'text', max = '') => `<input class="input" data-k="${k}" type="${type}" value="${esc(type === 'number' ? (a[k] || '') : a[k])}" placeholder="${esc(ph)}" ${type === 'number' ? `min="0" ${max ? `max="${max}"` : ''} inputmode="decimal"` : ''}>`;
  const f = (l, c) => `<div><label class="lbl">${l}</label>${c}</div>`;
  let body = '';
  if (s === 0) body = f('الاسم الكامل', inp('name', 'أدخل اسمك')) + f('تاريخ الميلاد', inp('birthDate', '', 'date')) + f('مكان الإقامة', inp('residence', 'المدينة / البلد')) + f('بلد المنشأ', inp('originCountry', 'البلد الأصلي')) + f('اللغات المتقنة', inp('languages', 'العربية، الإنجليزية...')) + f('العملة المستخدمة', `<select class="input" data-k="currency">${CURRENCIES.map(([v, l]) => `<option value="${v}" ${a.currency === v ? 'selected' : ''}>${l} (${v})</option>`).join('')}</select>`);
  if (s === 1) body = f('المستوى الدراسي', sel('educationLevel', ['ثانوي', 'دبلوم', 'بكالوريوس', 'ماجستير', 'دكتوراه'])) + f('مجال العمل', inp('workField', 'مثال: تقنية المعلومات')) + f('مستوى الخبرة', sel('experienceLevel', [['مبتدئ', 'مبتدئ (0-2 سنة)'], ['متوسط', 'متوسط (3-5 سنوات)'], ['متقدم', 'متقدم (6-10 سنوات)'], ['خبير', 'خبير (+10 سنوات)']])) + f('الدخل الحالي (شهري)', inp('currentIncome', '0', 'number')) + f('مصادر الدخل', inp('incomeSources', 'راتب، عمل حر، استثمارات...'));
  if (s === 2) body = f('الحالة الاجتماعية', sel('maritalStatus', [['أعزب', 'أعزب/عزباء'], ['متزوج', 'متزوج/ة'], ['مطلق', 'مطلق/ة'], ['أرمل', 'أرمل/ة']])) + f('عدد أفراد العائلة', inp('familyMembers', '0', 'number', 50)) + f('تفاصيل العائلة (اختياري)', inp('familyDetails', 'مثال: زوجة + 3 أطفال'));
  if (s === 3) {
    a.commitments = Array.isArray(a.commitments) ? a.commitments : [];
    const used = new Set(a.commitments.map(x => x.k));
    body = `<div style="grid-column:1/-1"><p class="small muted" style="margin-bottom:10px">هذه أوقات <b>لا تتنازل عنها</b>: الدوام، النوم، التعليم، القرآن، العائلة… الموقع يحجزها أولاً، ولن يخطط للعمل الحر إلا في ما يتبقى من أسبوعك (168 ساعة).</p>
      <div class="row wrap" style="gap:6px;margin-bottom:12px">${COMMIT_PRESETS.filter(([k]) => k === 'custom' || !used.has(k)).map(([k, l]) => `<button class="btn outline sm" data-addc="${k}">${I('plus')} ${l}</button>`).join('')}</div>
      <div id="cm-list">${a.commitments.length ? a.commitments.map((x, i) => `<div class="cmrow"><div class="row" style="gap:6px">${I(COMMIT_ICON[x.k] || 'flag')}<input class="input" data-ci="${i}" data-cf="n" value="${esc(x.n)}" placeholder="اسم الالتزام"></div>
        <div class="row" style="gap:4px"><input class="input" type="number" min="0" max="24" step="0.5" inputmode="decimal" data-ci="${i}" data-cf="h" value="${x.h || ''}" aria-label="ساعات يومياً"><span class="xs muted">س/يوم ×</span><input class="input" type="number" min="0" max="7" inputmode="decimal" data-ci="${i}" data-cf="d" value="${x.d || ''}" aria-label="أيام أسبوعياً"><span class="xs muted">أيام</span></div>
        <span class="xs bold ltr" data-cw="${i}">${fix(pos(x.h, 24) * pos(x.d, 7), 1)} س/أسبوع</span><button class="iconbtn danger" data-cdel="${i}" title="حذف">${I('trash')}</button></div>`).join('') : '<div class="empty" style="padding:16px">لم تضف أي التزام بعد. ابدأ بالنوم والدوام إن كنت موظفاً.</div>'}</div>
      <div id="cm-sum" style="margin-top:12px"></div></div>`;
  }
  const last = s === STEPS.length - 1;
  view.innerHTML = `<div style="max-width:680px;margin:0 auto">
    <h1 class="page" style="margin-bottom:20px">الملف الشخصي</h1>
    <div class="steps">${STEPS.map((t, i) => `<button class="step ${i <= s ? 'on' : ''}" data-step="${i}" style="text-align:right"><div class="n">${i < s ? I('check') : i + 1}</div><span class="t small ${i <= s ? '' : 'muted'}">${t}</span>${i < STEPS.length - 1 ? '<div class="line"></div>' : ''}</button>`).join('')}</div>
    <div class="card"><div class="grid g2">${body}</div><div id="pv"></div>
      <div class="between wrap" style="margin-top:24px;gap:8px">
        <button class="btn outline" id="prev" ${s === 0 ? 'disabled' : ''}>${I('right')} السابق</button>
        <div class="row">
          ${last ? '' : `<button class="btn outline" id="psave">${I('check')} حفظ</button>`}
          ${last ? `<button class="btn accent" id="save">${I('check')} حفظ والمتابعة</button>` : `<button class="btn" id="next">التالي ${I('left')}</button>`}
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h3 class="bold row" style="margin-bottom:4px">${I('shield')} تغيير كلمة المرور</h3><p class="xs muted" style="margin-bottom:12px">إذا أعطاك المدرّب كلمة مرور مؤقتة، غيّرها هنا. (يحتاج اتصالاً بالإنترنت)</p>
      <div class="grid g2"><input class="input" type="password" id="np1" placeholder="كلمة المرور الجديدة" dir="ltr" style="text-align:left" autocomplete="new-password"><input class="input" type="password" id="np2" placeholder="تأكيد كلمة المرور" dir="ltr" style="text-align:left" autocomplete="new-password"></div>
      <div id="npmsg" style="margin-top:8px"></div><button class="btn outline sm" id="npbtn" style="margin-top:8px">تحديث كلمة المرور</button></div>
  </div>`;
  const check = () => {
    const errs = [];
    if (pos(a.currentIncome) !== num(a.currentIncome)) errs.push('الدخل لا يمكن أن يكون سالباً');
    if (num(a.familyMembers) < 0 || num(a.familyMembers) > 50) errs.push('عدد أفراد العائلة غير منطقي');
    if (a.birthDate && (a.birthDate > today() || a.birthDate < '1900-01-01')) errs.push('تاريخ الميلاد غير صحيح');
    const tb = timeBudget({ profile: a });
    if (tb.week > 168) errs.push(`مجموع التزاماتك ${fix(tb.week, 0)} ساعة أسبوعياً، والأسبوع 168 ساعة فقط`);
    if ((a.commitments || []).some(x => num(x.h) > 24 || num(x.d) > 7 || num(x.h) < 0 || num(x.d) < 0)) errs.push('الساعات اليومية حتى 24 والأيام حتى 7');
    const sm = $('#cm-sum', view);
    if (sm) {
      const pct = x => Math.min(x / 168 * 100, 100);
      sm.innerHTML = `<div class="splitbar" style="height:16px"><div style="width:${pct(tb.week)}%;background:hsl(var(--primary))"></div><div class="paid" style="width:${pct(tb.free)}%"></div></div>
        <div class="between small" style="margin-top:6px"><span><b class="ltr">${fix(tb.week, 1)}</b> ساعة محجوزة أسبوعياً</span><span class="success"><b class="ltr">${fix(tb.free, 1)}</b> ساعة متبقية للعمل الحر والراحة</span></div>
        ${tb.defined && !tb.hasSleep ? `<div class="alert warn" style="margin-top:8px">${I('alert')}<span>لم تضف النوم؛ أضفه حتى لا يحسب الموقع ساعات نومك كوقت متاح.</span></div>` : ''}`;
      $$('[data-cw]', view).forEach(el => { const x = a.commitments[+el.dataset.cw]; if (x) el.textContent = fix(pos(x.h, 24) * pos(x.d, 7), 1) + ' س/أسبوع'; });
    }
    $('#pv', view).innerHTML = errs.length ? `<div class="alert danger" style="margin-top:12px">${I('alert')}<span>${errs.join('، ')}</span></div>` : '';
    return !errs.length;
  };
  $$('[data-k]', view).forEach(el => {
    const h = () => { const k = el.dataset.k; a[k] = el.type === 'number' ? num(el.value) : el.value; check(); };
    el.addEventListener('input', h); el.addEventListener('change', h);
  });
  $$('[data-addc]', view).forEach(b => b.onclick = () => { const pr = COMMIT_PRESETS.find(x => x[0] === b.dataset.addc); a.commitments = [...(a.commitments || []), { id: sid(), k: pr[0], n: pr[0] === 'custom' ? '' : pr[1], h: pr[2], d: pr[3] }]; PAGES['/profile'](view); });
  $$('[data-cdel]', view).forEach(b => b.onclick = () => { a.commitments.splice(+b.dataset.cdel, 1); PAGES['/profile'](view); });
  $$('[data-ci]', view).forEach(i => { i.oninput = () => { const x = a.commitments[+i.dataset.ci]; const f = i.dataset.cf; x[f] = f === 'n' ? i.value : num(i.value); i.classList.toggle('bad', f !== 'n' && (num(i.value) < 0 || num(i.value) > (f === 'h' ? 24 : 7))); check(); }; });
  check();
  const commit = complete => {
    if (!check()) return false;
    a.commitments = (a.commitments || []).map(x => ({ ...x, h: pos(x.h, 24), d: pos(x.d, 7) }));
    a.currentIncome = pos(a.currentIncome); a.familyMembers = pos(a.familyMembers, 50);
    D.profile = { ...a }; if (complete) D.profileComplete = true; markDirty('profile');
    toast('تم الحفظ', navigator.onLine ? 'تم تحديث ملفك الشخصي' : 'محفوظ على جهازك وسيُرفع عند الاتصال');
    return true;
  };
  const go = i => { profStep = i; PAGES['/profile'](view); };
  $$('[data-step]', view).forEach(b => b.onclick = () => go(+b.dataset.step));
  $('#prev', view).onclick = () => go(Math.max(0, s - 1));
  if ($('#next', view)) $('#next', view).onclick = () => go(s + 1);
  if ($('#psave', view)) $('#psave', view).onclick = () => commit(D.profileComplete);
  if ($('#save', view)) $('#save', view).onclick = () => { if (commit(true)) { profDraft = null; profStep = 0; location.hash = '#/lifestyle'; } };
  $('#npbtn', view).onclick = async () => {
    const p1 = $('#np1', view).value, p2 = $('#np2', view).value, m = $('#npmsg', view);
    if (p1.length < 6) { m.innerHTML = '<div class="alert danger">كلمة المرور 6 أحرف على الأقل</div>'; return; }
    if (p1 !== p2) { m.innerHTML = '<div class="alert danger">كلمتا المرور غير متطابقتين</div>'; return; }
    if (!navigator.onLine) { m.innerHTML = '<div class="alert warn">تحتاج اتصالاً بالإنترنت</div>'; return; }
    const b = $('#npbtn', view); b.disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    b.disabled = false;
    m.innerHTML = error ? `<div class="alert danger">${esc(AR_ERR(error.message))}</div>` : '<div class="alert info">تم تحديث كلمة المرور ✓</div>';
    if (!error) { $('#np1', view).value = ''; $('#np2', view).value = ''; }
  };
  return () => { profDraft = null; };
};

PAGES['/lifestyle'] = view => {

  const jump = m.lifeN > 0 && m.lifeT > m.lifeN * 1.5;
  view.innerHTML = `<div style="max-width:980px;margin:0 auto">
    <div class="pagehead"><div><h1 class="page">لايف ستايل</h1><p class="muted small">سجّل مصاريفك <b>الحالية</b> كما هي اليوم، ومصاريفك <b>المستهدفة</b> التي تطمح لها. البنود السنوية (رسوم مدارس، تأمين، مناسبات) أدخلها كما هي وفعّل «سنوي» لتُقسَّم على 12 شهراً.</p></div></div>

      <li>اضغط <b>؟</b> بجانب أي بند لترى شرحه.</li></ul>`)}

function openCat(c, view) {
  const rows = c.fields.map(f => { const v = (D.lifestyle[c.key] || {})[f]; if (v == null) return { n: 0, t: 0, y: false }; if (typeof v !== 'object') return { n: 0, t: pos(v), y: false }; return { n: pos(v.n), t: pos(v.t), y: !!v.y }; });
  const ov = document.createElement('div'); ov.className = 'overlay';
  const tot = () => { let n = 0, t = 0; rows.forEach(r => { n += r.y ? r.n / 12 : r.n; t += r.y ? r.t / 12 : r.t; }); return { n, t }; };
  ov.innerHTML = `<div class="modal" role="dialog" style="max-width:640px"><div class="mh"><h3 style="font-size:1.15rem;font-weight:800">${c.label}</h3><p class="muted xs">أدخل المبلغ الحالي والمستهدف لكل بند. فعّل «سنوي» إذا كان المبلغ يُدفع مرة في السنة. (اضغط ؟ لشرح البند)</p></div>
    <div class="mb"><div class="lrow lhead xs muted"><span></span><span>الحالي</span><span>المستهدف</span><span>سنوي</span></div>
    ${c.fields.map((f, i) => `<div class="lrow"><div class="row"><label class="small" style="font-weight:600">${esc(f)}</label>${c.d[f] ? `<span class="help"><button type="button" class="qbtn" aria-label="شرح ${esc(f)}">؟</button><span class="tip"><b>${esc(f)}</b><br>${esc(c.d[f])}</span></span>` : ''}</div>
      <input class="input" type="number" min="0" inputmode="decimal" data-i="${i}" data-k="n" value="${rows[i].n || ''}" placeholder="0" aria-label="${esc(f)} الحالي">
      <input class="input" type="number" min="0" inputmode="decimal" data-i="${i}" data-k="t" value="${rows[i].t || ''}" placeholder="0" aria-label="${esc(f)} المستهدف">
      <label class="ytog" title="المبلغ يُدفع سنوياً"><input type="checkbox" data-i="${i}" data-k="y" ${rows[i].y ? 'checked' : ''}><span>سنوي</span></label></div>`).join('')}
    <button class="btn ghost sm" id="cpy" style="margin-top:8px">${I('step')} انسخ الحالي إلى المستهدف للبنود الفارغة</button></div>
    <div class="mf"><div class="small"><div>الحالي/شهر: <b class="ltr" id="mtn"></b></div><div>المستهدف/شهر: <b class="ltr success" id="mtt"></b></div></div><div class="row"><button class="btn outline" id="mc">إلغاء</button><button class="btn" id="ms">حفظ</button></div></div></div>`;
  document.body.appendChild(ov);
  const show = () => { const x = tot(); $('#mtn', ov).textContent = fmt(x.n); $('#mtt', ov).textContent = fmt(x.t); };
  show();
  const close = () => ov.remove();
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });

  $$('input[data-k]', ov).forEach(inp => {
    const r = rows[+inp.dataset.i], k = inp.dataset.k;
    if (k === 'y') { inp.onchange = () => { r.y = inp.checked; show(); }; return; }
    inp.oninput = () => { const v = num(inp.value); inp.classList.toggle('bad', v < 0 || v > 1e9); r[k] = pos(v); show(); };
    inp.onblur = () => { if (inp.value !== '' && num(inp.value) < 0) inp.value = 0; inp.classList.remove('bad'); };
  });
  $('#cpy', ov).onclick = () => { rows.forEach((r, i) => { if (!r.t && r.n) { r.t = r.n; const el = $(`input[data-i="${i}"][data-k="t"]`, ov); if (el) el.value = r.n; } }); show(); };
  $('#mc', ov).onclick = close;
  $('#ms', ov).onclick = () => { const clean = {}; c.fields.forEach((f, i) => { const r = rows[i]; if (r.n || r.t) clean[f] = { n: r.n, t: r.t, ...(r.y ? { y: true } : {}) }; }); D.lifestyle[c.key] = clean; markDirty('lifestyle', c.key); close(); PAGES['/lifestyle'](view); };
  const first = $('input[data-k="n"]', ov); if (first) first.focus();
}

function openKeypad() {

  document.body.appendChild(ov);
  const calc = (a, b, o) => o === '+' ? a + b : o === '-' ? a - b : o === '×' ? a * b : o === '÷' ? (b === 0 ? 0 : a / b) : b;
  const show = () => { $('#kv', ov).textContent = cur; $('#ko', ov).textContent = op ? `${prev} ${op}` : ''; };
  const press = k => {
    if (/[0-9]/.test(k)) { if (wait) { cur = k; wait = false; } else cur = cur === '0' ? k : cur + k; }
    else if (k === '.') { if (wait) { cur = '0.'; wait = false; } else if (!cur.includes('.')) cur += '.'; }
    else if (k === 'C') { cur = '0'; prev = null; op = null; wait = false; }

      <div><h4 class="bold small" style="margin-bottom:8px">أحداث ${new Date(calSel + 'T00:00:00').toLocaleDateString('ar-EG')}</h4>${sel.length === 0 ? '<p class="small muted">لا توجد أحداث في هذا اليوم.</p>' : `<ul style="list-style:none;display:grid;gap:6px">${sel.map(x => { const k = KINDS[x.n.kind]; return `<li class="between tip-card" style="padding:8px 10px"><span class="row"><span class="badge" style="background:${k.bg};color:${k.fg}">${I(k.icon)}${k.label}</span><span class="small ${x.n.done ? 'muted' : ''}" style="${x.n.done ? 'text-decoration:line-through' : ''}">${esc(x.n.title)}</span></span><span class="xs muted ltr">${x.s.slice(5)} → ${x.e.slice(5)}</span></li>`; }).join('')}</ul>`}</div></div>`;
    $('#cm-prev', view).onclick = () => { calMonth = Mo === 11 ? [Y + 1, 0] : [Y, Mo + 1]; calendar(); };
    $('#cm-next', view).onclick = () => { calMonth = Mo === 0 ? [Y - 1, 11] : [Y, Mo - 1]; calendar(); };
    $$('[data-d]', $('#calbody', view)).forEach(b => b.onclick = () => { calSel = b.dataset.d; calendar(); });
  };
  const refreshAll = () => { plan.nodes.forEach(refreshNode); requestAnimationFrame(drawEdges); stats(); calendar(); };

  let pending = null;
  const hint = t => { $('#chint', view).innerHTML = t ? `<div class="connecthint">${t}</div>` : ''; };
  const clearPending = () => { pending = null; $$('.handle.armed', nodesEl).forEach(h => h.classList.remove('armed')); hint(''); };

    $$('[data-f]', el).forEach(i => {

        else if (f === 'durationDays') { n.durationDays = i.value === '' ? undefined : pos(i.value, 3650); n.durationManual = i.value !== ''; }
        n.u = Date.now();
        if (f === 'title') { save(); calendar(); return; }

    });

      e.stopPropagation();

      if (!b.dataset.sure) { b.dataset.sure = '1'; b.style.background = 'hsl(var(--destructive)/.15)'; b.title = 'اضغط مرة أخرى للحذف'; toast('اضغط مرة أخرى لحذف البطاقة'); setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.style.background = ''; } }, 3000); return; }
      const t = Date.now(); plan.deleted[n.id] = t; plan.edges.filter(x => x.source === n.id || x.target === n.id).forEach(x => plan.deleted[x.id] = t);
      plan.nodes = plan.nodes.filter(x => x.id !== n.id); plan.edges = plan.edges.filter(x => x.source !== n.id && x.target !== n.id); el.remove(); refreshAll(); save();
    };
    $('[data-del]', el).addEventListener('pointerdown', e => e.stopPropagation());
    $$('.handle', el).forEach(hd => {
      hd.addEventListener('pointerdown', e => e.stopPropagation());
      hd.onclick = e => {
        e.stopPropagation();
        const type = hd.dataset.h;
        if (!pending) { pending = { id: n.id, type }; hd.classList.add('armed'); hint(type === 'b' ? 'اختر النقطة العلوية للبطاقة التالية' : 'اختر النقطة السفلية للبطاقة السابقة'); return; }
        if (pending.id === n.id) { clearPending(); return; }
        let s = pending.id, t = n.id;
        if (pending.type === 't' && type === 'b') { s = n.id; t = pending.id; }
        if (!plan.edges.some(x => x.source === s && x.target === t)) plan.edges.push({ id: 'e-' + sid(), source: s, target: t, u: Date.now() });
        clearPending(); refreshAll(); save();

    });
    const head = $('.nh', el);
    head.addEventListener('pointerdown', e => {
      if (e.button !== 0) return; e.stopPropagation(); e.preventDefault();
      const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y, z = plan.view.z;
      head.setPointerCapture(e.pointerId);
      const mv = ev => { n.x = Math.round(ox + (ev.clientX - sx) / z); n.y = Math.round(oy + (ev.clientY - sy) / z); el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; drawEdges(); };
      const up = () => { head.removeEventListener('pointermove', mv); head.removeEventListener('pointerup', up); head.removeEventListener('pointercancel', up); if (n.x !== ox || n.y !== oy) { n.u = Date.now(); save(); } };
      head.addEventListener('pointermove', mv); head.addEventListener('pointerup', up); head.addEventListener('pointercancel', up);
    });
  };
  const renderNodes = () => { nodesEl.innerHTML = plan.nodes.map(nodeHTML).join(''); $$('.pnode', nodesEl).forEach(bindNode); refreshAll(); };

  // pan & zoom
  const ptrs = new Map(); let pinch = null;
  cv.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; } }, true);
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = cv.getBoundingClientRect(); if (pinch.d > 0) zoomAt(d / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch.d = d; }
  }, true);

  cv.addEventListener('pointerup', endPtr, true); cv.addEventListener('pointercancel', endPtr, true);
  cv.addEventListener('pointerdown', e => {
    if (e.target.closest('.pnode') || e.target.closest('.zoomctl') || e.target.closest('path')) return;
    if (pending) { clearPending(); return; }
    if (ptrs.size > 1) return;

    cv.classList.add('panning'); cv.setPointerCapture(e.pointerId);

    const up = () => { cv.classList.remove('panning'); cv.removeEventListener('pointermove', mv); cv.removeEventListener('pointerup', up); cv.removeEventListener('pointercancel', up); save(); };
    cv.addEventListener('pointermove', mv); cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  });
  const zoomAt = (f, cx, cy) => { const v = plan.view, nz = Math.min(2, Math.max(0.3, v.z * f)); const r = nz / v.z; v.x = cx - (cx - v.x) * r; v.y = cy - (cy - v.y) * r; v.z = nz; applyView(); save(); };
  let wheelHintT = 0;
  cv.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) { if (Date.now() - wheelHintT > 4000) { wheelHintT = Date.now(); hint('للتكبير والتصغير: اضغط Ctrl (أو ⌘) مع عجلة الماوس'); setTimeout(() => { if (!pending) hint(''); }, 2200); } return; }
    e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0025), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  $('#zout', view).onclick = () => zoomAt(1 / 1.2, cv.clientWidth / 2, cv.clientHeight / 2);
  const fit = () => {
    if (!plan.nodes.length) { plan.view = { x: 0, y: 0, z: 1 }; applyView(); return; }
    const els = plan.nodes.map(n => ({ n, el: $(`[data-n="${n.id}"]`, nodesEl) }));
    const minX = Math.min(...els.map(o => o.n.x)), minY = Math.min(...els.map(o => o.n.y)), maxX = Math.max(...els.map(o => o.n.x + (o.el ? o.el.offsetWidth : 250))), maxY = Math.max(...els.map(o => o.n.y + (o.el ? o.el.offsetHeight : 300)));

  };
  $('#zfit', view).onclick = fit;
  $$('[data-add]', view).forEach(b => b.onclick = () => {
    const k = b.dataset.add, v = plan.view, W = cv.clientWidth, H = cv.clientHeight;

    plan.nodes.push(n); nodesEl.insertAdjacentHTML('beforeend', nodeHTML(n)); bindNode(nodesEl.lastElementChild); refreshAll(); save();
  });

  document.addEventListener('keydown', esck);
  const onResize = debounce(drawEdges, 100); window.addEventListener('resize', onResize);
  applyView(); renderNodes();
  if (!plan._fitted) { plan._fitted = true; requestAnimationFrame(fit); }
  return () => { document.removeEventListener('keydown', esck); window.removeEventListener('resize', onResize); };
};

function genPass() { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let r = ''; const a = new Uint32Array(8); (crypto.getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 1e9)); a.forEach(x => r += c[x % c.length]); return r; }
function exportCSV(rows) {

  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [head].concat(rows.map(e => [e.name, e.email, st[e.status] || e.status, e.created ? String(e.created).slice(0, 10) : '', e.profileComplete ? 'مكتمل' : 'غير مكتمل', e.workField, e.currency, e.mode === 'side' ? 'بجانب وظيفة' : 'تفرّغ', Math.round(e.currentIncome), Math.round(e.lifeNow), Math.round(e.life), Math.round(e.goal), Math.round(e.monthGoal), fix(e.hourlyRate, 1), e.market || '', { ok: 'واقعي', close: 'قريب', far: 'غير واقعي', unknown: '' }[e.realism], Math.round(e.fixedWeek), e.freeWeek == null ? '' : Math.round(e.freeWeek), e.overCommit ? 'نعم' : '', Math.round(e.monthEarned), fix(e.progressPercent, 0), Math.round(e.allEarned)])).map(r => r.map(q).join(','));

}
function openTempPass(e) {

    <p class="small muted" style="margin-bottom:10px">سيتم استبدال كلمة مرور الطالب بهذه الكلمة. أرسلها له، واطلب منه تغييرها من صفحة «الملف الشخصي» بعد الدخول.</p>
    <label class="lbl">كلمة المرور المؤقتة</label><div class="row"><input class="input ltr" id="tp" value="${pw}" style="text-align:left;font-family:monospace;font-size:1.1rem"><button class="btn outline sm" id="tpc">نسخ</button></div><div id="tpm" style="margin-top:10px"></div></div>
    <div class="mf"><button class="btn outline" id="tpx">إلغاء</button><button class="btn" id="tps">${I('check')} تعيين كلمة المرور</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove(); $('#tpx', ov).onclick = close; ov.addEventListener('mousedown', ev => { if (ev.target === ov) close(); });
  $('#tpc', ov).onclick = async () => { try { await navigator.clipboard.writeText($('#tp', ov).value); toast('تم النسخ'); } catch (er) { $('#tp', ov).select(); } };
  $('#tps', ov).onclick = async () => {
    const v = $('#tp', ov).value.trim(), m = $('#tpm', ov);
    if (v.length < 6) { m.innerHTML = '<div class="alert danger">6 أحرف على الأقل</div>'; return; }
    if (!navigator.onLine) { m.innerHTML = '<div class="alert warn">تحتاج اتصالاً بالإنترنت</div>'; return; }
    const b = $('#tps', ov); b.disabled = true; b.textContent = 'جاري...';

      const { data, error } = await sb.functions.invoke('admin-set-password', { body: { user_id: e.userId, password: v } });
      let msg = error ? error.message : (data && data.error);
      if (error && error.context && error.context.json) { try { const j = await error.context.json(); msg = j.error || msg; } catch (x) {} }
      if (msg) throw new Error(msg);
      m.innerHTML = `<div class="alert info">${I('check')}<span>تم تعيين كلمة المرور. أرسلها للطالب: <b class="ltr">${esc(v)}</b></span></div>`;
      b.style.display = 'none'; $('#tpx', ov).textContent = 'إغلاق';
    } catch (er) { m.innerHTML = `<div class="alert danger">${esc(er.message || String(er))}</div>`; b.disabled = false; b.innerHTML = I('check') + ' تعيين كلمة المرور'; }
  };
}

    const aq = $('#aq', view); aq.oninput = debounce(() => { adminQ = aq.value; const pos0 = aq.selectionStart; draw(rowsAll, false, err); const n = $('#aq', view); n.focus(); n.setSelectionRange(pos0, pos0); }, 200);
    $$('[data-i]', view).forEach(b => b.onclick = () => details(rows[+b.dataset.i]));
    $$('[data-tp]', view).forEach(b => b.onclick = () => openTempPass(rows[+b.dataset.tp]));
    $$('[data-act]', view).forEach(b => b.onclick = async () => {
      if (!navigator.onLine) return toast('لا يوجد اتصال', 'الموافقة تحتاج إنترنت', true);
      b.disabled = true;
      const res = await sb.from('user_status').update({ status: b.dataset.act, decided_at: new Date().toISOString() }).eq('user_id', b.dataset.u).select();
      if (res.error || !res.data || !res.data.length) { toast('تعذّر التحديث', res.error ? res.error.message : 'لا تملك الصلاحية', true); b.disabled = false; return; }
      toast(b.dataset.act === 'approved' ? 'تم تفعيل الحساب' : 'تم رفض/إيقاف الحساب');

    const ov = document.createElement('div'); ov.className = 'overlay';

    ov.innerHTML = `<div class="modal"><div class="mh between"><h3 class="bold">تفاصيل: ${esc(e.name)}</h3><button class="iconbtn" id="dx">${I('x')}</button></div><div class="mb">
      <h4 class="bold small" style="margin-bottom:6px">اللايف ستايل</h4>${e.lifestyle.length ? e.lifestyle.map(l => `<div class="kv small"><span>${esc(lab(l.category))}</span><span class="ltr bold">${fmt(Object.values(l.items || {}).reduce((a, b) => a + itemVal(b, 't'), 0))}</span></div>`).join('') : '<p class="small muted">لا توجد بيانات</p>'}

  if (q) { e.preventDefault(); e.stopPropagation(); const h = q.parentElement, was = h.classList.contains('open'); $$('.help.open').forEach(x => x.classList.remove('open')); if (!was) h.classList.add('open'); return; }

/* ---------- boot ---------- */
async function boot() {
  const app = $('#app');
  app.innerHTML = '<div class="loading">جاري التحميل...</div>';
  let last = null; try { last = JSON.parse(LS.get('lc512:lastUser') || 'null'); } catch (e) {}
  let session = null;
  if (sb) { try { session = (await withTimeout(sb.auth.getSession(), navigator.onLine ? 6000 : 1500)).data.session; } catch (e) {} }
  if (session) setUser(session.user);
  else if (last && last.id) { setUser(last); syncState = navigator.onLine ? 'auth' : 'off'; }
  render();
  if (user) sync();
  if (sb) sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_IN' && s && (!user || user.id !== s.user.id)) { setUser(s.user); render(); sync(); }
    if (ev === 'TOKEN_REFRESHED' && syncState === 'auth') { syncState = 'idle'; sync(); }
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.__SW__) { try { navigator.serviceWorker.register(window.__SW__); } catch (e) {} }
}
boot();
})();
